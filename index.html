  <script>
    const PIN_RAHASIA = "laatahzan"; // 🔑 PIN Akses Pengurus

    function cekAksesPengurus() {
      // Cek apakah browser sudah menyimpan status login
      const isAuth = localStorage.getItem('rqbi_authenticated');

      if (isAuth !== 'true') {
        const inputPin = prompt("🔒 Halaman Terbatas!\nMasukkan PIN Pengurus / Ustadzah Rumah Qur'an Baitul Itqan:");
        
        if (inputPin === PIN_RAHASIA) {
          localStorage.setItem('rqbi_authenticated', 'true');
          alert("✅ PIN Benar! Akses diberikan.");
        } else {
          alert("❌ PIN Salah atau dibatalkan! Anda akan dialihkan ke Halaman Profil Lembaga.");
          window.location.href = "tamu.html";
        }
      }
    }

    function logoutPengurus() {
      if (confirm("Apakah Anda yakin ingin mengunci kembali aplikasi ini?")) {
        localStorage.removeItem('rqbi_authenticated');
        window.location.href = "tamu.html";
      }
    }

    // ⚠️ WAJIB DIPANGGIL AGAR PERINTAH PIN LANGSUNG DIJALANKAN
    cekAksesPengurus();
  </script>

    const todayISO = new Date().toISOString().substring(0, 10);
    document.getElementById('tanggal').value = todayISO;
    document.getElementById('absen_tanggal').value = todayISO;

    // Helper untuk membersihkan & merapikan nomor HP ke format 62xxx
    function rapihkanNoHp(no) {
      if (!no) return "";
      let cleaned = String(no).replace(/\D/g, ''); // Hapus semua karakter selain angka
      if (cleaned.startsWith('0')) {
        cleaned = '62' + cleaned.substring(1);
      }
      return cleaned;
    }

    // TAB SWITCHER FUNCTION
    function switchTab(tab) {
      const tabPrestasi = document.getElementById('tabPrestasi');
      const tabAbsensi = document.getElementById('tabAbsensi');
      const btnPrestasi = document.getElementById('tabBtnPrestasi');
      const btnAbsensi = document.getElementById('tabBtnAbsensi');

      if (tab === 'prestasi') {
        tabPrestasi.classList.remove('hidden');
        tabAbsensi.classList.add('hidden');
        btnPrestasi.className = "w-1/2 py-2.5 rounded-lg bg-white text-emerald-700 shadow-sm transition-all text-center font-bold";
        btnAbsensi.className = "w-1/2 py-2.5 rounded-lg text-slate-600 hover:text-slate-800 transition-all text-center font-bold";
      } else {
        tabAbsensi.classList.remove('hidden');
        tabPrestasi.classList.add('hidden');
        btnAbsensi.className = "w-1/2 py-2.5 rounded-lg bg-white text-emerald-700 shadow-sm transition-all text-center font-bold";
        btnPrestasi.className = "w-1/2 py-2.5 rounded-lg text-slate-600 hover:text-slate-800 transition-all text-center font-bold";
      }
    }

    // Populate Dropdown Surat
    function populateSurat() {
      const selectSurat = document.getElementById('hafalan_surat');
      const totalSurat = daftarSurat.length;
      daftarSurat.forEach((surat, index) => {
        const nomorSurat = totalSurat - index;
        selectSurat.innerHTML += `<option value="${surat}">${nomorSurat}. ${surat}</option>`;
      });
    }

    // Load Data Santri & Filter Kelas dari Supabase
    async function loadSantri() {
      try {
        const { data, error } = await db.from('santri').select('*').order('nama_santri');
        if (error) throw error;

        globalDataSantri = data;

        const daftarKelas = [...new Set(globalDataSantri.map(s => s.kelas))].filter(Boolean);
        
        // Populate Dropdown Kelas untuk Prestasi
        const selectKelas = document.getElementById('filter_kelas');
        selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';

        // Populate Dropdown Kelas untuk Absensi
        const selectKelasAbsen = document.getElementById('absen_filter_kelas');
        selectKelasAbsen.innerHTML = '<option value="">-- Pilih Kelas --</option>';

        daftarKelas.forEach(kelas => {
          selectKelas.innerHTML += `<option value="${kelas}">${kelas}</option>`;
          selectKelasAbsen.innerHTML += `<option value="${kelas}">${kelas}</option>`;
        });

      } catch (err) {
        alert("Gagal memuat data santri dari Supabase: " + err.message);
      }
    }

    // Sisipkan karakter hijaiyah ke posisi kursor aktif
    function insertHijaiyah(char) {
      const input = document.getElementById('ummi_materi');
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const text = input.value;

      input.value = text.substring(0, start) + char + text.substring(end);
      input.selectionStart = input.selectionEnd = start + char.length;
      input.focus();
    }

    // Event Listener Filter Santri berdasarkan Kelas (Prestasi)
    document.getElementById('filter_kelas').addEventListener('change', (e) => {
      const kelasDipilih = e.target.value;
      const selectSantri = document.getElementById('id_santri');

      if (!kelasDipilih) {
        selectSantri.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
        selectSantri.disabled = true;
        return;
      }

      const santriFiltered = globalDataSantri.filter(s => s.kelas === kelasDipilih);
      
      selectSantri.innerHTML = '<option value="">-- Pilih Santri --</option>';
      santriFiltered.forEach(santri => {
        selectSantri.innerHTML += `<option value="${santri.id_santri}">${santri.nama_santri}</option>`;
      });
      selectSantri.disabled = false;
    });

    // Event Submit Form Prestasi ke Supabase & Pemicu WA
    document.getElementById('formPrestasi').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Lagi menyimpan...";
      btn.disabled = true;

      const payload = {
        id_santri: parseInt(document.getElementById('id_santri').value),
        tm_ke: parseInt(document.getElementById('tm_ke').value) || null,
        tanggal: document.getElementById('tanggal').value,
        hafalan_surat: document.getElementById('hafalan_surat').value,
        hafalan_ayat: document.getElementById('hafalan_ayat').value,
        hafalan_nilai: document.getElementById('hafalan_nilai').value,
        ummi_jilid: document.getElementById('ummi_jilid').value,
        ummi_halaman: document.getElementById('ummi_halaman').value,
        ummi_materi: document.getElementById('ummi_materi').value,
        ummi_nilai: document.getElementById('ummi_nilai').value,
        disimak_guru: document.getElementById('disimak_guru').value,
        disimak_ortu: "Pending"
      };

      try {
        // 1. Simpan data ke Supabase
        const { data, error } = await db.from('kartu_prestasi').insert([payload]).select();

        if (error) throw error;

        const idBaru = data[0].id_prestasi;
        const santriTerpilih = globalDataSantri.find(s => String(s.id_santri) === String(payload.id_santri));
        let noHpOrtu = santriTerpilih ? rapihkanNoHp(santriTerpilih.no_hp_ortu) : "";
        const namaSantri = santriTerpilih ? santriTerpilih.nama_santri : "Santri";

        // 2. Jika nomor HP Ortu belum ada di database, tanyakan langsung via prompt
        if (!noHpOrtu) {
          const inputManual = prompt(`Data berhasil disimpan!\nNamun nomor HP orang tua "${namaSantri}" belum ada di database.\n\nMasukkan nomor HP WhatsApp Ortu sekarang (Contoh: 081234567890):`);
          if (inputManual) {
            noHpOrtu = rapihkanNoHp(inputManual);
          }
        }

        const linkKonfirmasi = `${BASE_URL_GITHUB}/konfirmasi.html?id=${idBaru}`;

        // 3. Draf pesan lengkap dengan nilai
        const teksPesan = `Assalamu'alaikum Wr. Wb. Bapak/Ibu Wali dari *${namaSantri}*.\n\nBerikut ringkasan setoran hari ini:\n- Hafalan: ${payload.hafalan_surat || '-'} (${payload.hafalan_ayat || '-'}) | Nilai: ${payload.hafalan_nilai || '-'}\n- Ummi: ${payload.ummi_jilid || '-'} Hal. ${payload.ummi_halaman || '-'} | Nilai: ${payload.ummi_nilai || '-'}\n\nMohon disimak kembali di rumah, lalu klik link di bawah ini untuk konfirmasi:\n${linkKonfirmasi}\n\nJazakumullah khair.`;

        // 4. Tanya dan Buka WA
        if (noHpOrtu) {
          if (confirm(`Kirimkan laporan setoran ${namaSantri} ke WhatsApp Orang Tua (${noHpOrtu}) sekarang?`)) {
            const waUrl = `https://wa.me/${noHpOrtu}?text=${encodeURIComponent(teksPesan)}`;
            window.location.href = waUrl;
          }
        } else {
          alert("Data prestasi berhasil disimpan tanpa pengiriman laporan WhatsApp.");
        }

        document.getElementById('formPrestasi').reset();
        document.getElementById('id_santri').disabled = true;
        document.getElementById('tanggal').value = todayISO;

      } catch (err) {
        alert("Gagal menyimpan data ke Supabase: " + err.message);
      } finally {
        btn.innerText = "Simpan Data";
        btn.disabled = false;
      }
    });

    // ================= LOGIKA ABSENSI KELAS =================
    
    // Render Daftar Santri per Kelas untuk Absensi
    function renderDaftarAbsenSantri() {
      const kelasDipilih = document.getElementById('absen_filter_kelas').value;
      const container = document.getElementById('containerAbsenSantri');
      const btnSimpan = document.getElementById('btnSimpanAbsen');
      const countInfo = document.getElementById('absenCountInfo');

      if (!kelasDipilih) {
        container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400 bg-slate-50 rounded-lg col-span-full">Pilih kelas terlebih dahulu untuk menampilkan daftar santri.</div>`;
        btnSimpan.disabled = true;
        countInfo.innerText = "0 Santri";
        return;
      }

      const listSantriKelas = globalDataSantri.filter(s => s.kelas === kelasDipilih);
      countInfo.innerText = `${listSantriKelas.length} Santri`;

      if (listSantriKelas.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400 bg-slate-50 rounded-lg col-span-full">Tidak ada santri di kelas ini.</div>`;
        btnSimpan.disabled = true;
        return;
      }

      container.innerHTML = '';
      listSantriKelas.forEach(santri => {
        container.innerHTML += `
          <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg flex items-center justify-between gap-2">
            <span class="text-xs font-semibold text-slate-800 truncate">${santri.nama_santri}</span>
            <div class="flex gap-1">
              <label class="cursor-pointer">
                <input type="radio" name="status_absen_${santri.id_santri}" value="Hadir" checked class="peer hidden">
                <span class="px-2 py-1 bg-white border border-slate-300 text-[11px] rounded peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-600 font-medium transition-all">H</span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="status_absen_${santri.id_santri}" value="Sakit" class="peer hidden">
                <span class="px-2 py-1 bg-white border border-slate-300 text-[11px] rounded peer-checked:bg-amber-500 peer-checked:text-white peer-checked:border-amber-500 font-medium transition-all">S</span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="status_absen_${santri.id_santri}" value="Izin" class="peer hidden">
                <span class="px-2 py-1 bg-white border border-slate-300 text-[11px] rounded peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 font-medium transition-all">I</span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="status_absen_${santri.id_santri}" value="Alfa" class="peer hidden">
                <span class="px-2 py-1 bg-white border border-slate-300 text-[11px] rounded peer-checked:bg-rose-600 peer-checked:text-white peer-checked:border-rose-600 font-medium transition-all">A</span>
              </label>
            </div>
          </div>
        `;
      });

      btnSimpan.disabled = false;
    }

    // Simpan Absensi Masal Satu Kelas
    async function simpanAbsensiMasal() {
      const kelasDipilih = document.getElementById('absen_filter_kelas').value;
      const tanggalAbsen = document.getElementById('absen_tanggal').value;
      const btn = document.getElementById('btnSimpanAbsen');

      if (!kelasDipilih || !tanggalAbsen) {
        alert("Pilih kelas dan tanggal absensi!");
        return;
      }

      const listSantriKelas = globalDataSantri.filter(s => s.kelas === kelasDipilih);
      const payloadAbsensi = [];

      listSantriKelas.forEach(santri => {
        const statusSelected = document.querySelector(`input[name="status_absen_${santri.id_santri}"]:checked`)?.value || 'Hadir';
        payloadAbsensi.push({
          id_santri: santri.id_santri,
          tanggal: tanggalAbsen,
          status: statusSelected
        });
      });

      btn.innerText = "Menyimpan Absensi...";
      btn.disabled = true;

      try {
        const { error } = await db.from('absensi').insert(payloadAbsensi);
        if (error) throw error;

        alert(`Berhasil! Absensi ${payloadAbsensi.length} santri kelas ${kelasDipilih} tanggal ${tanggalAbsen} telah tersimpan.`);
        
        // Reset pilihan kelas absensi
        document.getElementById('absen_filter_kelas').value = '';
        renderDaftarAbsenSantri();

      } catch (err) {
        alert("Gagal menyimpan absensi: " + err.message);
      } finally {
        btn.innerText = "Simpan Absensi Kelas";
      }
    }

    populateSurat();
    loadSantri();
  </script>
</body>
</html>
