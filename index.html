<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumah Qur'an Baitul Itqan - Input Prestasi</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dk8fg3wgm/image/upload/v1786163785/fav_ugojic.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

  <div class="bg-emerald-600 text-white p-3 sticky top-0 shadow-md z-10 flex items-center justify-center gap-3">
    <img src="https://res.cloudinary.com/dk8fg3wgm/image/upload/v1786163785/fav_ugojic.png" alt="Logo RQ Baitul Itqan" class="w-8 h-8 rounded-full bg-white p-0.5 shadow-sm">
    <div class="text-center">
      <h1 class="text-base font-bold leading-tight">Rumah Qur'an Baitul Itqan</h1>
      <p class="text-[11px] text-emerald-100 font-medium">📖 Kartu Prestasi Santri</p>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4">
    <div class="flex justify-between items-center mb-4 text-xs font-medium">
      <a href="santri.html" class="bg-white hover:bg-slate-100 text-emerald-700 px-3 py-2 rounded-lg border border-slate-200 shadow-sm flex items-center gap-1.5 transition-all">
        <span>👥</span> Kelola Santri
      </a>
      <a href="prestasi.html" class="bg-white hover:bg-slate-100 text-emerald-700 px-3 py-2 rounded-lg border border-slate-200 shadow-sm flex items-center gap-1.5 transition-all">
        <span>📜</span> Rekap Prestasi
      </a>
    </div>

    <form id="formPrestasi" class="bg-white rounded-xl shadow-sm p-5 space-y-4 border border-slate-100">
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Kelas</label>
          <select id="filter_kelas" required class="w-full border rounded-lg p-2.5 bg-slate-50 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="">-- Memuat Kelas... --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Santri</label>
          <select id="id_santri" required disabled class="w-full border rounded-lg p-2.5 bg-slate-50 text-sm focus:ring-2 focus:ring-emerald-500 outline-none disabled:bg-slate-200">
            <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">TM Ke-</label>
          <input type="number" id="tm_ke" required placeholder="Contoh: 12" class="w-full border rounded-lg p-2.5 text-sm outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
          <input type="date" id="tanggal" required class="w-full border rounded-lg p-2.5 text-sm outline-none">
        </div>
      </div>

      <hr class="border-dashed my-2">

      <p class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Setoran Hafalan</p>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <select id="hafalan_surat" class="w-full border rounded-lg p-2.5 text-sm outline-none bg-white">
            <option value="">-- Pilih Surat --</option>
          </select>
        </div>
        <div>
          <input type="text" id="hafalan_ayat" placeholder="Ayat (cth: 1-15)" class="w-full border rounded-lg p-2.5 text-sm outline-none">
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Nilai Hafalan</label>
        <input 
          type="text" 
          id="hafalan_nilai" 
          placeholder="Masukkan Nilai (cth: 90)" 
          class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-white"
        >
      </div>

      <hr class="border-dashed my-2">

      <p class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Metode Ummi</p>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <select id="ummi_jilid" class="w-full border rounded-lg p-2.5 text-sm outline-none bg-white">
            <option value="">-- Pilih Jilid/Qur'an --</option>
            <option value="Jilid 1">Jilid 1</option>
            <option value="Jilid 2">Jilid 2</option>
            <option value="Jilid 3">Jilid 3</option>
            <option value="Jilid 4">Jilid 4</option>
            <option value="Jilid 5">Jilid 5</option>
            <option value="Jilid 6">Jilid 6</option>
            <option value="Ghorib">Ghorib</option>
            <option value="Tajwid">Tajwid</option>
            <option value="Al Qur'an">Al Qur'an</option>
          </select>
        </div>
        <div>
          <input type="text" id="ummi_halaman" placeholder="Halaman" class="w-full border rounded-lg p-2.5 text-sm outline-none">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <input 
            type="text" 
            id="ummi_materi" 
            placeholder="Materi / Pokok (cth: Mad Jaiz / 👈 klik tombol)" 
            class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-white"
          >
          
          <div class="mt-2 bg-slate-100 p-2.5 rounded-lg border border-slate-200 space-y-2">
            <div>
              <span class="text-[10px] text-slate-500 font-bold block mb-1">HARAKAT:</span>
              <div class="flex flex-wrap gap-1">
                <button type="button" onclick="insertHijaiyah(' َ')" class="px-2 py-1 bg-white hover:bg-emerald-100 border rounded text-xs font-bold active:bg-emerald-200">َ (Fathah)</button>
                <button type="button" onclick="insertHijaiyah(' ِ')" class="px-2 py-1 bg-white hover:bg-emerald-100 border rounded text-xs font-bold active:bg-emerald-200">ِ (Kasrah)</button>
                <button type="button" onclick="insertHijaiyah(' ُ')" class="px-2 py-1 bg-white hover:bg-emerald-100 border rounded text-xs font-bold active:bg-emerald-200">ُ (Dhammah)</button>
                <button type="button" onclick="insertHijaiyah(' ً')" class="px-2 py-1 bg-white hover:bg-emerald-100 border rounded text-xs font-bold active:bg-emerald-200">ً (Tanwin)</button>
                <button type="button" onclick="insertHijaiyah(' ْ')" class="px-2 py-1 bg-white hover:bg-emerald-100 border rounded text-xs font-bold active:bg-emerald-200">ْ (Sukun)</button>
                <button type="button" onclick="insertHijaiyah(' ّ')" class="px-2 py-1 bg-white hover:bg-emerald-100 border rounded text-xs font-bold active:bg-emerald-200">ّ (Tasydid)</button>
              </div>
            </div>

            <div>
              <span class="text-[10px] text-slate-500 font-bold block mb-1">HURUF HIJAIYAH (30):</span>
              <div class="flex flex-wrap gap-1 justify-start" style="direction: rtl;">
                <button type="button" onclick="insertHijaiyah('ا')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ا</button>
                <button type="button" onclick="insertHijaiyah('ب')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ب</button>
                <button type="button" onclick="insertHijaiyah('ت')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ت</button>
                <button type="button" onclick="insertHijaiyah('ث')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ث</button>
                <button type="button" onclick="insertHijaiyah('ج')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ج</button>
                <button type="button" onclick="insertHijaiyah('ح')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ح</button>
                <button type="button" onclick="insertHijaiyah('خ')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">خ</button>
                <button type="button" onclick="insertHijaiyah('د')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">د</button>
                <button type="button" onclick="insertHijaiyah('ذ')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ذ</button>
                <button type="button" onclick="insertHijaiyah('ر')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ر</button>
                <button type="button" onclick="insertHijaiyah('ز')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ز</button>
                <button type="button" onclick="insertHijaiyah('س')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">س</button>
                <button type="button" onclick="insertHijaiyah('ش')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ش</button>
                <button type="button" onclick="insertHijaiyah('ص')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ص</button>
                <button type="button" onclick="insertHijaiyah('ض')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ض</button>
                <button type="button" onclick="insertHijaiyah('ط')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ط</button>
                <button type="button" onclick="insertHijaiyah('ظ')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ظ</button>
                <button type="button" onclick="insertHijaiyah('ع')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ع</button>
                <button type="button" onclick="insertHijaiyah('غ')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">غ</button>
                <button type="button" onclick="insertHijaiyah('ف')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ف</button>
                <button type="button" onclick="insertHijaiyah('ق')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ق</button>
                <button type="button" onclick="insertHijaiyah('ك')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ك</button>
                <button type="button" onclick="insertHijaiyah('ل')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ل</button>
                <button type="button" onclick="insertHijaiyah('م')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">م</button>
                <button type="button" onclick="insertHijaiyah('ن')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ن</button>
                <button type="button" onclick="insertHijaiyah('و')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">و</button>
                <button type="button" onclick="insertHijaiyah('هـ')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">هـ</button>
                <button type="button" onclick="insertHijaiyah('ء')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ء</button>
                <button type="button" onclick="insertHijaiyah('لا')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">لا</button>
                <button type="button" onclick="insertHijaiyah('ي')" class="w-8 h-8 bg-white hover:bg-emerald-100 border rounded text-base font-bold shadow-sm active:bg-emerald-200">ي</button>
              </div>
            </div>
          </div>
        </div>

        <div>
          <select id="ummi_nilai" class="w-full border rounded-lg p-2.5 text-sm outline-none bg-white">
            <option value="">-- Nilai Ummi --</option>
            <option value="A+">A+</option>
            <option value="A">A</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B">B</option>
            <option value="B-">B-</option>
            <option value="C+">C+</option>
          </select>
        </div>
      </div>

      <hr class="border-dashed my-2">

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Disimak Oleh (Guru)</label>
        <select id="disimak_guru" required class="w-full border rounded-lg p-2.5 text-sm outline-none bg-white">
          <option value="">-- Pilih Ustadzah --</option>
          <option value="Ustadzah Salamah">Ustadzah Salamah</option>
          <option value="Ustadzah Rosianah">Ustadzah Rosianah</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition-all text-white font-medium py-3 rounded-lg shadow mt-2">
        Simpan Data
      </button>

    </form>
  </div>

  <script>
    // ⚠️ SESUAIKAN DENGAN API URL & ANON KEY SUPABASE ANDA
    const SUPABASE_URL = "https://dzgshmfgklbtpgglcbnh.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Z3NobWZna2xidHBnZ2xjYm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNDUwMTQsImV4cCI6MjEwMTcyMTAxNH0.BBqqL82VDj7G-unamkgGTNoiR3Eg_xGntDM4EofWhyA"; 
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ⚠️ SESUAIKAN DENGAN URL GITHUB PAGES ANDA
    const BASE_URL_GITHUB = "https://username_anda.github.io/nama_repository";

// Daftar 114 Surah Al-Qur'an (Urutan Dibalik: 114 An-Nas s.d 1 Al-Fatihah)
const daftarSurat = [
  "An-Nas", "Al-Falaq", "Al-Ikhlash", "Al-Lahab", "An-Nashr", "Al-Kafirun", "Al-Kautsar", "Al-Ma'un", "Quraisy", "Al-Fil",
  "Al-Humazah", "Al-'Asr", "At-Takatsur", "Al-Qari'ah", "Al-'Adiyat", "Az-Zalzalah", "Al-Bayyinah", "Al-Qadr", "Al-'Alaq", "At-Tin",
  "Asy-Syarh", "Ad-Dhuha", "Al-Lail", "Asy-Syams", "Al-Balad", "Al-Fajr", "Al-Ghasyiyah", "Al-A'la", "Ath-Thariq", "Al-Buruj",
  "Al-Insyiqaq", "Al-Muthaffifin", "Al-Infitar", "At-Takwir", "'Abasa", "An-Nazi'at", "An-Naba'", "Al-Mursalat", "Al-Insan", "Al-Qiyamah",
  "Al-Muddatstsir", "Al-Muzzammil", "Al-Jinn", "Nuh", "Al-Ma'arij", "Al-Haqqah", "Al-Qalam", "Al-Mulk", "At-Tahrim", "At-Thalaq",
  "At-Taghabun", "Al-Munafiqun", "Al-Jumu'ah", "Ash-Shaff", "Al-Mumtahanah", "Al-Hasyr", "Al-Mujadilah", "Al-Hadid", "Al-Waqi'ah", "Ar-Rahman",
  "Al-Qamar", "An-Najm", "Ath-Thur", "Adz-Dzariyat", "Qaf", "Al-Hujurat", "Al-Fath", "Muhammad", "Al-Ahqaf", "Al-Jatsiyah",
  "Ad-Dukhan", "Az-Zukhruf", "Asy-Syura", "Fushshilat", "Ghafir", "Az-Zumar", "Shad", "Ash-Shaffat", "Ya-Sin", "Fathir",
  "Saba'", "Al-Ahzab", "As-Sajdah", "Luqman", "Ar-Rum", "Al-'Ankabut", "Al-Qasash", "An-Naml", "Asy-Syu'ara'", "Al-Furqan",
  "An-Nur", "Al-Mu'minun", "Al-Hajj", "Al-Anbiya'", "Tha-Ha", "Maryam", "Al-Kahf", "Al-Isra'", "An-Nahl", "Al-Hijr",
  "Ibrahim", "Ar-Ra'd", "Yusuf", "Hud", "Yunus", "At-Taubah", "Al-Anfal", "Al-A'raf", "Al-An me", "Al-Ma'idah",
  "An-Nisa'", "Ali 'Imran", "Al-Baqarah", "Al-Fatihah"
];

    let globalDataSantri = [];

    // Set tanggal default ke hari ini
    document.getElementById('tanggal').value = new Date().toISOString().substring(0, 10);

    // Populate Dropdown Surat
	function populateSurat() {
	  const selectSurat = document.getElementById('hafalan_surat');
	  const totalSurat = daftarSurat.length; // 114
	  
	  daftarSurat.forEach((surat, index) => {
		// Menghitung nomor asli surah (114 - index)
		const nomorSurat = totalSurat - index;
		selectSurat.innerHTML += `<option value="${surat}">${nomorSurat}. ${surat}</option>`;
	  });
	}

    // Load Data Santri & Filter Kelas dari Supabase
    async function loadSantri() {
      try {
        const { data, error } = await db.from('santri').select('*').order('nama_santri');
        if (error) throw error;

        globalDataSantri = data;

        const daftarKelas = [...new Set(globalDataSantri.map(s => s.kelas))].filter(Boolean);
        
        const selectKelas = document.getElementById('filter_kelas');
        selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        daftarKelas.forEach(kelas => {
          selectKelas.innerHTML += `<option value="${kelas}">${kelas}</option>`;
        });

      } catch (err) {
        alert("Gagal memuat data santri dari Supabase: " + err.message);
      }
    }

    // Sisipkan karakter hijaiyah ke posisi kursor aktif
    function insertHijaiyah(char) {
      const input = document.getElementById('ummi_materi');
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const text = input.value;

      input.value = text.substring(0, start) + char + text.substring(end);
      input.selectionStart = input.selectionEnd = start + char.length;
      input.focus();
    }

    // Event Listener Filter Santri berdasarkan Kelas
    document.getElementById('filter_kelas').addEventListener('change', (e) => {
      const kelasDipilih = e.target.value;
      const selectSantri = document.getElementById('id_santri');

      if (!kelasDipilih) {
        selectSantri.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
        selectSantri.disabled = true;
        return;
      }

      const santriFiltered = globalDataSantri.filter(s => s.kelas === kelasDipilih);
      
      selectSantri.innerHTML = '<option value="">-- Pilih Santri --</option>';
      santriFiltered.forEach(santri => {
        selectSantri.innerHTML += `<option value="${santri.id_santri}">${santri.nama_santri}</option>`;
      });
      selectSantri.disabled = false;
    });

    // Event Submit Form ke Supabase & Pemicu WA
    document.getElementById('formPrestasi').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Lagi menyimpan...";
      btn.disabled = true;

      const payload = {
        id_santri: parseInt(document.getElementById('id_santri').value),
        tm_ke: parseInt(document.getElementById('tm_ke').value),
        tanggal: document.getElementById('tanggal').value,
        hafalan_surat: document.getElementById('hafalan_surat').value,
        hafalan_ayat: document.getElementById('hafalan_ayat').value,
        hafalan_nilai: document.getElementById('hafalan_nilai').value,
        ummi_jilid: document.getElementById('ummi_jilid').value,
        ummi_halaman: document.getElementById('ummi_halaman').value,
        ummi_materi: document.getElementById('ummi_materi').value,
        ummi_nilai: document.getElementById('ummi_nilai').value,
        disimak_guru: document.getElementById('disimak_guru').value,
        disimak_ortu: "Pending"
      };

      try {
        const { data, error } = await db.from('kartu_prestasi').insert([payload]).select();

        if (error) throw error;

        const idBaru = data[0].id_prestasi;
        const santriTerpilih = globalDataSantri.find(s => s.id_santri == payload.id_santri);
        const noHpOrtu = santriTerpilih ? santriTerpilih.no_hp_ortu : "";
        const namaSantri = santriTerpilih ? santriTerpilih.nama_santri : "Santri";

        const linkKonfirmasi = `${BASE_URL_GITHUB}/konfirmasi.html?id=${idBaru}`;

        const teksPesan = `Assalamu'alaikum Wr. Wb. Bapak/Ibu Wali dari *${namaSantri}*.\n\nBerikut ringkasan setoran hari ini:\n- Hafalan: ${payload.hafalan_surat || '-'} (${payload.hafalan_ayat || '-'})\n- Ummi: ${payload.ummi_jilid || '-'} Hal. ${payload.ummi_halaman || '-'}\n\nMohon disimak kembali di rumah, lalu klik link di bawah ini untuk konfirmasi:\n${linkKonfirmasi}\n\nJazakumullah khair.`;

        if (confirm("Data prestasi berhasil disimpan! Kirimkan pesan konfirmasi ke WhatsApp Orang Tua sekarang?")) {
          const waUrl = `https://wa.me/${noHpOrtu}?text=${encodeURIComponent(teksPesan)}`;
          window.open(waUrl, '_blank');
        }

        document.getElementById('formPrestasi').reset();
        document.getElementById('id_santri').disabled = true;
        document.getElementById('tanggal').value = new Date().toISOString().substring(0, 10);

      } catch (err) {
        alert("Gagal menyimpan data ke Supabase: " + err.message);
      } finally {
        btn.innerText = "Simpan Data";
        btn.disabled = false;
      }
    });

    populateSurat();
    loadSantri();
  </script>
</body>
</html>
