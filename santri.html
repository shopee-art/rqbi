<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Data Santri - Rumah Quran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-10">

  <div class="bg-emerald-600 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <h1 class="text-lg font-bold">👥 Kelola Data Santri</h1>
    <a href="index.html" class="text-xs bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-lg border border-emerald-500">
      ← Kembali
    </a>
  </div>

  <div class="max-w-4xl mx-auto p-4 space-y-6">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-100 space-y-3">
        <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
          <span>➕</span> Tambah Santri Manual
        </h2>
        <form id="formTambah" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Nama Santri</label>
            <input type="text" id="addNama" required placeholder="Contoh: Ahmad Zaki" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Kelas / Halaqah</label>
            <input type="text" id="addKelas" required placeholder="Contoh: Halaqah 1" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">No. HP Orang Tua (WA)</label>
            <input type="text" id="addNoHp" placeholder="Contoh: 6281234567890" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <button type="submit" id="btnSimpanManual" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-xs transition-all">
            Simpan Santri
          </button>
        </form>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-100 space-y-3">
        <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
          <span>📥</span> Import dari Excel / CSV
        </h2>
        <p class="text-xs text-slate-500">
          Format header Excel: <code class="bg-slate-100 px-1 py-0.5 rounded text-emerald-600 font-semibold">nama_santri</code>, <code class="bg-slate-100 px-1 py-0.5 rounded text-emerald-600 font-semibold">kelas</code>, <code class="bg-slate-100 px-1 py-0.5 rounded text-emerald-600 font-semibold">no_hp_ortu</code>.
        </p>

        <div class="border-2 border-dashed border-slate-200 rounded-lg p-3 text-center bg-slate-50 hover:bg-slate-100 transition-all cursor-pointer">
          <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700">
        </div>

        <button id="btnUploadExcel" disabled class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-xs transition-all disabled:bg-slate-300 disabled:cursor-not-allowed">
          Unggah Excel ke Database
        </button>
      </div>

    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden space-y-4 p-5">
      
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
        <div>
          <h2 class="text-base font-bold text-slate-800">Daftar Santri</h2>
          <p class="text-xs text-slate-500" id="totalSantriInfo">Memuat data...</p>
        </div>

        <div class="w-full md:w-auto flex gap-2">
          <input type="text" id="searchKeyword" placeholder="Cari nama santri..." class="text-xs p-2 border border-slate-300 rounded-lg w-full md:w-48 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <div class="overflow-x-auto border rounded-lg">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-slate-100 border-b font-semibold text-slate-700">
            <tr>
              <th class="p-3">No</th>
              <th class="p-3">Nama Santri</th>
              <th class="p-3">Kelas</th>
              <th class="p-3">No HP Ortu</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelSantriBody" class="divide-y text-slate-600">
            <tr>
              <td colspan="5" class="p-4 text-center text-slate-400">Sedang mengambil data...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>

  <div id="modalEdit" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg p-5 max-w-sm w-full space-y-4">
      <h3 class="text-sm font-bold text-slate-800">✏️ Edit Data Santri</h3>
      
      <form id="formEdit" class="space-y-3">
        <input type="hidden" id="editId">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Nama Santri</label>
          <input type="text" id="editNama" required class="w-full text-xs p-2.5 border border-slate-300 rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Kelas</label>
          <input type="text" id="editKelas" required class="w-full text-xs p-2.5 border border-slate-300 rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">No. HP Ortu</label>
          <input type="text" id="editNoHp" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="tutupModalEdit()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs rounded-lg font-medium">Batal</button>
          <button type="submit" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs rounded-lg font-medium">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ⚠️ ISI DENGAN API URL & ANON KEY SUPABASE ANDA
    const SUPABASE_URL = "https://dzgshmfgklbtpgglcbnh.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Z3NobWZna2xidHBnZ2xjYm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNDUwMTQsImV4cCI6MjEwMTcyMTAxNH0.BBqqL82VDj7G-unamkgGTNoiR3Eg_xGntDM4EofWhyA"; 
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let listSantri = [];
    let parsedExcelData = [];

    // --- READ (TAMPILKAN DATA) ---
    async function loadDataSantri() {
      try {
        const { data, error } = await db
          .from('santri')
          .select('*')
          .order('nama_santri', { ascending: true });

        if (error) throw error;
        listSantri = data;
        renderTabel(listSantri);
      } catch (err) {
        alert("Gagal memuat data: " + err.message);
      }
    }

    function renderTabel(data) {
      const tbody = document.getElementById('tabelSantriBody');
      const totalInfo = document.getElementById('totalSantriInfo');
      tbody.innerHTML = '';

      totalInfo.innerText = `Total: ${data.length} Santri`;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Belum ada data santri.</td></tr>`;
        return;
      }

      data.forEach((item, index) => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition-all">
            <td class="p-3 text-slate-400">${index + 1}</td>
            <td class="p-3 font-semibold text-slate-800">${item.nama_santri}</td>
            <td class="p-3"><span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-medium">${item.kelas}</span></td>
            <td class="p-3">${item.no_hp_ortu || '-'}</td>
            <td class="p-3 text-center space-x-1">
              <button onclick="bukaModalEdit(${item.id_santri})" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-2 py-1 rounded text-xs">Edit</button>
              <button onclick="hapusSantri(${item.id_santri}, '${item.nama_santri}')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-2 py-1 rounded text-xs">Hapus</button>
            </td>
          </tr>
        `;
      });
    }

    // --- CREATE MANUAL ---
    document.getElementById('formTambah').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('addNama').value;
      const kelas = document.getElementById('addKelas').value;
      const noHp = formatNoHp(document.getElementById('addNoHp').value);

      try {
        const { error } = await db.from('santri').insert([{ nama_santri: nama, kelas: kelas, no_hp_ortu: noHp }]);
        if (error) throw error;

        alert("Santri berhasil ditambahkan!");
        document.getElementById('formTambah').reset();
        loadDataSantri();
      } catch (err) {
        alert("Gagal menambah santri: " + err.message);
      }
    });

    // --- CREATE VIA EXCEL ---
    document.getElementById('excelFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          const rawJson = XLSX.utils.sheet_to_json(worksheet, { raw: false });

          parsedExcelData = rawJson.map(row => ({
            nama_santri: row.nama_santri || row.Nama || row.NAMA || '',
            kelas: row.kelas || row.Kelas || row.KELAS || '',
            no_hp_ortu: formatNoHp(row.no_hp_ortu || row.no_hp || row.NoHP || '')
          })).filter(s => s.nama_santri !== '');

          if (parsedExcelData.length > 0) {
            document.getElementById('btnUploadExcel').disabled = false;
            document.getElementById('btnUploadExcel').innerText = `Unggah ${parsedExcelData.length} Santri`;
          }
        } catch (err) {
          alert("Gagal membaca file Excel: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    document.getElementById('btnUploadExcel').addEventListener('click', async () => {
      const btn = document.getElementById('btnUploadExcel');
      btn.innerText = "Mengunggah...";
      btn.disabled = true;

      try {
        const { error } = await db.from('santri').insert(parsedExcelData);
        if (error) throw error;

        alert(`Berhasil mengunggah ${parsedExcelData.length} data santri!`);
        document.getElementById('excelFile').value = '';
        parsedExcelData = [];
        loadDataSantri();
      } catch (err) {
        alert("Gagal mengunggah: " + err.message);
      } finally {
        btn.innerText = "Unggah Excel ke Database";
      }
    });

    // --- UPDATE ---
    function bukaModalEdit(id) {
      const santri = listSantri.find(s => s.id_santri === id);
      if (!santri) return;

      document.getElementById('editId').value = santri.id_santri;
      document.getElementById('editNama').value = santri.nama_santri;
      document.getElementById('editKelas').value = santri.kelas;
      document.getElementById('editNoHp').value = santri.no_hp_ortu || '';

      const modal = document.getElementById('modalEdit');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function tutupModalEdit() {
      const modal = document.getElementById('modalEdit');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    document.getElementById('formEdit').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const nama = document.getElementById('editNama').value;
      const kelas = document.getElementById('editKelas').value;
      const noHp = formatNoHp(document.getElementById('editNoHp').value);

      try {
        const { error } = await db.from('santri').update({
          nama_santri: nama,
          kelas: kelas,
          no_hp_ortu: noHp
        }).eq('id_santri', id);

        if (error) throw error;

        alert("Data santri berhasil diperbarui!");
        tutupModalEdit();
        loadDataSantri();
      } catch (err) {
        alert("Gagal memperbarui data: " + err.message);
      }
    });

    // --- DELETE ---
    async function hapusSantri(id, nama) {
      if (!confirm(`Apakah Anda yakin ingin menghapus santri "${nama}"?`)) return;

      try {
        const { error } = await db.from('santri').delete().eq('id_santri', id);
        if (error) throw error;

        alert("Santri berhasil dihapus.");
        loadDataSantri();
      } catch (err) {
        alert("Gagal menghapus santri: " + err.message);
      }
    }

    // --- SEARCH / FILTER ---
    document.getElementById('searchKeyword').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = listSantri.filter(s => 
        s.nama_santri.toLowerCase().includes(keyword) || 
        s.kelas.toLowerCase().includes(keyword)
      );
      renderTabel(filtered);
    });

    // --- HELPER FUNCTION ---
    function formatNoHp(no) {
      let cleaned = String(no).replace(/\D/g, '');
      if (cleaned.startsWith('0')) {
        cleaned = '62' + cleaned.substring(1);
      }
      return cleaned;
    }

    // Jalankan saat halaman dibuka
    loadDataSantri();
  </script>
</body>
</html>
