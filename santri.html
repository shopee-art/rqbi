<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Data Santri - Rumah Quran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

  <div class="bg-emerald-600 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <h1 class="text-lg font-bold">📥 Import Data Santri</h1>
    <a href="index.html" class="text-xs bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-lg border border-emerald-500">
      ← Kembali
    </a>
  </div>

  <div class="max-w-md mx-auto p-4 space-y-4">
    
    <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-100 space-y-4">
      
      <div>
        <h2 class="text-sm font-bold text-slate-700">Pilih File Excel / CSV</h2>
        <p class="text-xs text-slate-500 mt-1">
          Pastikan header kolom di Excel bernama: <code class="bg-slate-100 px-1 py-0.5 rounded text-emerald-600 font-semibold">nama_santri</code>, <code class="bg-slate-100 px-1 py-0.5 rounded text-emerald-600 font-semibold">kelas</code>, dan <code class="bg-slate-100 px-1 py-0.5 rounded text-emerald-600 font-semibold">no_hp_ortu</code>.
        </p>
      </div>

      <div class="border-2 border-dashed border-slate-200 rounded-lg p-4 text-center bg-slate-50 hover:bg-slate-100 transition-all cursor-pointer">
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
      </div>

      <div id="previewArea" class="hidden space-y-2">
        <div class="flex justify-between items-center text-xs font-semibold text-slate-600">
          <span>Pratinjau Data Santri:</span>
          <span id="totalBaris" class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">0 Santri</span>
        </div>
        
        <div class="max-h-40 overflow-y-auto border rounded-lg text-xs">
          <table class="w-full text-left border-collapse">
            <thead class="bg-slate-100 sticky top-0 border-b">
              <tr>
                <th class="p-2">Nama</th>
                <th class="p-2">Kelas</th>
                <th class="p-2">No HP</th>
              </tr>
            </thead>
            <tbody id="previewBody" class="divide-y">
              </tbody>
          </table>
        </div>
      </div>

      <button id="btnUpload" disabled class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition-all text-white font-medium py-3 rounded-lg shadow disabled:bg-slate-300 disabled:cursor-not-allowed">
        Unggah ke Supabase
      </button>

    </div>

    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs text-amber-800 space-y-1">
      <p class="font-bold">💡 Tips Format Nomor HP Ortu:</p>
      <p>Gunakan format kode negara <code class="font-bold">62</code> tanpa tanda (+) atau spasi, contoh: <code class="font-bold">6281234567890</code>.</p>
    </div>

  </div>

  <script>
    // ⚠️ ISI DENGAN API URL & ANON KEY SUPABASE ANDA
    const SUPABASE_URL = "https://dzgshmfgklbtpgglcbnh.supabase.co"; // [cite: 251]
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Z3NobWZna2xidHBnZ2xjYm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNDUwMTQsImV4cCI6MjEwMTcyMTAxNH0.BBqqL82VDj7G-unamkgGTNoiR3Eg_xGntDM4EofWhyA"; // [cite: 252]
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let parsedData = [];

    // Membaca File Excel saat dipilih
    document.getElementById('excelFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          
          // Konversi isi sheet ke JSON
          const rawJson = XLSX.utils.sheet_to_json(worksheet, { raw: false });

          // Bersihkan & petakan data agar sesuai kolom database
          parsedData = rawJson.map(row => ({
            nama_santri: row.nama_santri || row.Nama || row.NAMA || '',
            kelas: row.kelas || row.Kelas || row.KELAS || '',
            no_hp_ortu: formatNoHp(row.no_hp_ortu || row.no_hp || row.NoHP || '')
          })).filter(s => s.nama_santri !== ''); // Buang baris kosong

          if (parsedData.length === 0) {
            alert("File kosong atau format header tidak sesuai!");
            return;
          }

          // Tampilkan Pratinjau Data
          tampilkanPreview(parsedData);
          document.getElementById('btnUpload').disabled = false;

        } catch (err) {
          alert("Gagal membaca file Excel: " + err.message);
        }
      };

      reader.readAsArrayBuffer(file);
    });

    // Format nomor HP agar diawali 62
    function formatNoHp(no) {
      let cleaned = String(no).replace(/\D/g, ''); // Hapus karakter selain angka
      if (cleaned.startsWith('0')) {
        cleaned = '62' + cleaned.substring(1);
      }
      return cleaned;
    }

    // Tampilkan Pratinjau di Tabel
    function tampilkanPreview(data) {
      const tbody = document.getElementById('previewBody');
      tbody.innerHTML = '';

      data.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td class="p-2 font-medium">${item.nama_santri}</td>
            <td class="p-2">${item.kelas}</td>
            <td class="p-2">${item.no_hp_ortu || '-'}</td>
          </tr>
        `;
      });

      document.getElementById('totalBaris').innerText = `${data.length} Santri`;
      document.getElementById('previewArea').classList.remove('hidden');
    }

    // Unggah Data Masal ke Supabase
    document.getElementById('btnUpload').addEventListener('click', async () => {
      const btn = document.getElementById('btnUpload');
      btn.innerText = "Lagi Mengunggah...";
      btn.disabled = true;

      try {
        // Masukkan seluruh array data sekaligus ke tabel 'santri'
        const { error } = await db.from('santri').insert(parsedData);

        if (error) throw error;

        alert(`Berhasil! ${parsedData.length} data santri telah ditambahkan ke Supabase.`);
        
        // Reset Form
        document.getElementById('excelFile').value = '';
        document.getElementById('previewArea').classList.add('hidden');
        parsedData = [];

      } catch (err) {
        alert("Gagal mengunggah data: " + err.message);
      } finally {
        btn.innerText = "Unggah ke Supabase";
      }
    });
  </script>
</body>
</html>
