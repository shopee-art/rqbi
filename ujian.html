<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumah Qur'an Baitul Itqan - Ujian Kenaikan Jilid</title>

  <script>
    const PIN_RAHASIA = "laatahzan"; // 🔑 PIN Akses Pengurus

    function cekAksesPengurus() {
      const isAuth = localStorage.getItem('rqbi_authenticated');
      if (isAuth !== 'true') {
        const inputPin = prompt("🔒 Halaman Terbatas!\nMasukkan PIN Pengurus / Ustadzah Rumah Qur'an Baitul Itqan:");
        if (inputPin === PIN_RAHASIA) {
          localStorage.setItem('rqbi_authenticated', 'true');
        } else {
          alert("❌ PIN Salah atau dibatalkan! Anda akan dialihkan ke Halaman Profil Lembaga.");
          window.location.href = "tamu.html";
        }
      }
    }

    function logoutPengurus() {
      if (confirm("Apakah Anda yakin ingin mengunci kembali aplikasi ini?")) {
        localStorage.removeItem('rqbi_authenticated');
        window.location.href = "tamu.html";
      }
    }

    cekAksesPengurus();
  </script>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dk8fg3wgm/image/upload/v1786163785/fav_ugojic.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-10">

  <div class="bg-emerald-600 text-white p-3 sticky top-0 shadow-md z-10 flex items-center justify-between px-4">
    <div class="flex items-center gap-2">
      <img src="https://res.cloudinary.com/dk8fg3wgm/image/upload/v1786163785/fav_ugojic.png" alt="Logo RQ Baitul Itqan" class="w-8 h-8 rounded-full bg-white p-0.5 shadow-sm">
      <div>
        <h1 class="text-sm font-bold leading-tight">Rumah Qur'an Baitul Itqan</h1>
        <p class="text-[10px] text-emerald-100 font-medium">🎓 Input Ujian Kenaikan Jilid</p>
      </div>
    </div>
    <button onclick="logoutPengurus()" class="text-xs bg-emerald-700 hover:bg-emerald-800 active:scale-95 px-2.5 py-1.5 rounded-lg border border-emerald-500 font-semibold flex items-center gap-1 transition-all shadow">
      <span>🔒</span> Kunci
    </button>
  </div>

  <div class="max-w-md mx-auto p-4 space-y-4">

    <div class="grid grid-cols-3 gap-1.5 text-[11px] sm:text-xs font-medium mb-2">
      <a href="index.html" class="bg-white hover:bg-slate-100 text-emerald-700 py-2 px-1.5 rounded-lg border border-slate-200 shadow-sm flex items-center justify-center gap-1 transition-all text-center font-bold">
        <span>📖</span> Form Utama
      </a>
      <a href="santri.html" class="bg-white hover:bg-slate-100 text-emerald-700 py-2 px-1.5 rounded-lg border border-slate-200 shadow-sm flex items-center justify-center gap-1 transition-all text-center">
        <span>👥</span> Kelola Santri
      </a>
      <a href="prestasi.html" class="bg-white hover:bg-slate-100 text-emerald-700 py-2 px-1.5 rounded-lg border border-slate-200 shadow-sm flex items-center justify-center gap-1 transition-all text-center">
        <span>📜</span> Rekap Prestasi
      </a>
    </div>

    <form id="formUjian" class="bg-white rounded-xl shadow-sm p-5 space-y-4 border border-slate-100">
      <h2 class="text-xs font-bold text-emerald-700 uppercase tracking-wider border-b pb-2">Form Hasil Ujian Munaqosyah / Kenaikan</h2>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Kelas</label>
          <select id="filter_kelas" required class="w-full border rounded-lg p-2.5 bg-slate-50 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="">-- Memuat Kelas... --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Santri</label>
          <select id="id_santri" required disabled class="w-full border rounded-lg p-2.5 bg-slate-50 text-sm focus:ring-2 focus:ring-emerald-500 outline-none disabled:bg-slate-200">
            <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Ujian</label>
          <input type="date" id="tanggal" required class="w-full border rounded-lg p-2.5 text-sm outline-none bg-slate-50">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Ujian</label>
          <select id="nama_ujian" required class="w-full border rounded-lg p-2.5 text-sm outline-none bg-white focus:ring-2 focus:ring-emerald-500">
            <option value="">-- Pilih Ujian --</option>
            <option value="Kenaikan Jilid 2">Kenaikan Jilid 2</option>
            <option value="Kenaikan Jilid 3">Kenaikan Jilid 3</option>
            <option value="Kenaikan Jilid 4">Kenaikan Jilid 4</option>
            <option value="Kenaikan Jilid 5">Kenaikan Jilid 5</option>
            <option value="Kenaikan Jilid 6">Kenaikan Jilid 6</option>
            <option value="Kenaikan Ghorib">Kenaikan Ghorib</option>
            <option value="Kenaikan Tajwid">Kenaikan Tajwid</option>
            <option value="Kenaikan Al-Qur'an">Kenaikan Al-Qur'an</option>
          </select>
        </div>
      </div>

      <hr class="border-dashed my-1">

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nilai Ujian</label>
          <input type="text" id="nilai_ujian" required placeholder="Contoh: 88 / A" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Keterangan Status</label>
          <select id="keterangan" required class="w-full border rounded-lg p-2.5 text-sm outline-none bg-white font-semibold">
            <option value="Lulus">Lulus (Lanjut Jilid)</option>
            <option value="Belum Lulus">Belum Lulus (Mengulang)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Penguji (Ustadzah)</label>
        <select id="penguji" required class="w-full border rounded-lg p-2.5 text-sm outline-none bg-white">
          <option value="">-- Pilih Ustadzah Penguji --</option>
          <option value="Ustadzah Salamah">Ustadzah Salamah</option>
          <option value="Ustadzah Rosianah">Ustadzah Rosianah</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition-all text-white font-medium py-3 rounded-lg shadow mt-2">
        Simpan Hasil Ujian
      </button>

    </form>

  </div>

  <script>
    // ⚠️ SESUAIKAN DENGAN API URL & ANON KEY SUPABASE ANDA
    const SUPABASE_URL = "https://dzgshmfgklbtpgglcbnh.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Z3NobWZna2xidHBnZ2xjYm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNDUwMTQsImV4cCI6MjEwMTcyMTAxNH0.BBqqL82VDj7G-unamkgGTNoiR3Eg_xGntDM4EofWhyA"; 
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let globalDataSantri = [];

    // Set tanggal default ke hari ini
    const todayISO = new Date().toISOString().substring(0, 10);
    document.getElementById('tanggal').value = todayISO;

    // Helper merapikan nomor HP ke format 62xxx
    function rapihkanNoHp(no) {
      if (!no) return "";
      let cleaned = String(no).replace(/\D/g, '');
      if (cleaned.startsWith('0')) {
        cleaned = '62' + cleaned.substring(1);
      }
      return cleaned;
    }

    // Load Data Santri & Filter Kelas dari Supabase
    async function loadSantri() {
      try {
        const { data, error } = await db.from('santri').select('*').order('nama_santri');
        if (error) throw error;

        globalDataSantri = data;

        const daftarKelas = [...new Set(globalDataSantri.map(s => s.kelas))].filter(Boolean);
        const selectKelas = document.getElementById('filter_kelas');
        selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';

        daftarKelas.forEach(kelas => {
          selectKelas.innerHTML += `<option value="${kelas}">${kelas}</option>`;
        });

      } catch (err) {
        alert("Gagal memuat data santri dari Supabase: " + err.message);
      }
    }

    // Event Listener Filter Santri berdasarkan Kelas
    document.getElementById('filter_kelas').addEventListener('change', (e) => {
      const kelasDipilih = e.target.value;
      const selectSantri = document.getElementById('id_santri');

      if (!kelasDipilih) {
        selectSantri.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
        selectSantri.disabled = true;
        return;
      }

      const santriFiltered = globalDataSantri.filter(s => s.kelas === kelasDipilih);
      
      selectSantri.innerHTML = '<option value="">-- Pilih Santri --</option>';
      santriFiltered.forEach(santri => {
        selectSantri.innerHTML += `<option value="${santri.id_santri}">${santri.nama_santri}</option>`;
      });
      selectSantri.disabled = false;
    });

    // Event Submit Form Ujian ke Supabase & Pemicu WA
    document.getElementById('formUjian').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Lagi menyimpan...";
      btn.disabled = true;

      const payload = {
        id_santri: parseInt(document.getElementById('id_santri').value),
        tanggal: document.getElementById('tanggal').value,
        nama_ujian: document.getElementById('nama_ujian').value,
        nilai_ujian: document.getElementById('nilai_ujian').value,
        keterangan: document.getElementById('keterangan').value,
        penguji: document.getElementById('penguji').value
      };

      try {
        // 1. Simpan ke Supabase
        const { data, error } = await db.from('ujian_jilid').insert([payload]).select();
        if (error) throw error;

        // 2. Pencarian Data Santri & No HP Ortu
        const santriTerpilih = globalDataSantri.find(s => String(s.id_santri) === String(payload.id_santri));
        let noHpOrtu = santriTerpilih ? rapihkanNoHp(santriTerpilih.no_hp_ortu) : "";
        const namaSantri = santriTerpilih ? santriTerpilih.nama_santri : "Santri";

        // Prompt input jika nomor HP belum terdaftar
        if (!noHpOrtu) {
          const inputManual = prompt(`Hasil Ujian berhasil disimpan!\nNamun nomor HP orang tua "${namaSantri}" belum ada di database.\n\nMasukkan nomor HP WhatsApp Ortu sekarang (Contoh: 081234567890):`);
          if (inputManual) {
            noHpOrtu = rapihkanNoHp(inputManual);
          }
        }

        // Status Kelulusan (Emoji & Kata)
        const isLulus = payload.keterangan === 'Lulus';
        const ucapanLulus = isLulus 
          ? `🎉 *Selamat! Santri dinyatakan LULUS* dan diperkenankan melanjutkan ke tingkat berikutnya.` 
          : `💪 Santri dinyatakan *BELUM LULUS* dan perlu mengulang materi sebelum ujian kembali. Mohon bimbingan di rumah.`;

        // 3. Draf Pesan WA Pengumuman Ujian
        const teksPesan = `Assalamu'alaikum Wr. Wb. Bapak/Ibu Wali dari *${namaSantri}*.\n\nBerikut adalah Laporan Hasil Ujian Santri di Rumah Qur'an Baitul Itqan:\n\n📌 Ujian: *${payload.nama_ujian}*\n📅 Tanggal: ${payload.tanggal}\n📊 Nilai: *${payload.nilai_ujian}*\n🎓 Keterangan: *${payload.keterangan.toUpperCase()}*\n👩‍🏫 Penguji: ${payload.penguji}\n\n${ucapanLulus}\n\nJazakumullah khair atas perhatian dan kerjasamanya.`;

        // 4. Tanya dan Buka WA
        if (noHpOrtu) {
          if (confirm(`Kirimkan Laporan Ujian ${namaSantri} ke WhatsApp Orang Tua (${noHpOrtu}) sekarang?`)) {
            const waUrl = `https://wa.me/${noHpOrtu}?text=${encodeURIComponent(teksPesan)}`;
            window.location.href = waUrl;
          }
        } else {
          alert("Hasil ujian berhasil disimpan tanpa pengiriman laporan WhatsApp.");
        }

        // Reset Form
        document.getElementById('formUjian').reset();
        document.getElementById('id_santri').disabled = true;
        document.getElementById('tanggal').value = todayISO;

      } catch (err) {
        alert("Gagal menyimpan data ujian ke Supabase: " + err.message);
      } finally {
        btn.innerText = "Simpan Hasil Ujian";
        btn.disabled = false;
      }
    });

    loadSantri();
  </script>
</body>
</html>
